<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SNEC Daleel - Students List</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }
    body {
      background-color: #f1f5f9;
      margin: 0;
      padding: 25px;
    }
    .container {
      max-width: 1200px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
      margin-bottom: 20px;
    }
    h2 {
      margin: 0;
      color: #1e293b;
    }
    .controls {
      display: flex;
      gap: 10px;
    }
    input[type="text"] {
      padding: 10px 14px;
      border: 1.5px solid #cbd5e1;
      border-radius: 6px;
      font-size: 14px;
      min-width: 250px;
    }
    button.btn {
      padding: 10px 18px;
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 500;
      cursor: pointer;
    }
    button.btn-export {
      background-color: #16a34a;
    }
    .table-responsive {
      overflow-x: auto;
      margin-top: 15px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 13px;
    }
    th, td {
      padding: 12px 14px;
      border-bottom: 1px solid #e2e8f0;
      white-space: nowrap;
    }
    th {
      background-color: #f8fafc;
      color: #475569;
      font-weight: 600;
    }
    tr:hover {
      background-color: #f8fafc;
    }
    .badge {
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      background-color: #dcfce7;
      color: #15803d;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h2>Registered Students List</h2>
    <div class="controls">
      <input type="text" id="searchInput" placeholder="Search by name, phone, or place...">
      <button class="btn btn-export" id="exportBtn">Export CSV</button>
      <button class="btn" id="refreshBtn">Refresh</button>
    </div>
  </div>

  <div class="table-responsive">
    <table>
      <thead>
        <tr>
          <th>Sl No</th>
          <th>Full Name</th>
          <th>Mobile (ID)</th>
          <th>Email</th>
          <th>Place</th>
          <th>Address</th>
          <th>DOB</th>
          <th>Religious Degree</th>
          <th>Institution</th>
          <th>Secular Edu</th>
          <th>Profession</th>
          <th>Payment Details</th>
          <th>Reg. Date</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="studentTableBody">
        <tr>
          <td colspan="14" style="text-align:center; padding: 20px;">Loading data...</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Firebase SDKs -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAfaDp6H7eSToA5f4_TFhNGBU9OLoq4E7U",
    authDomain: "snec-daleel.firebaseapp.com",
    projectId: "snec-daleel",
    storageBucket: "snec-daleel.firebasestorage.app",
    messagingSenderId: "201962463257",
    appId: "1:201962463257:web:f56ceb2157984e1de28a88",
    measurementId: "G-NOWFFPDXJP"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  let allStudents = [];
  const tableBody = document.getElementById("studentTableBody");
  const searchInput = document.getElementById("searchInput");

  async function fetchStudents() {
    tableBody.innerHTML = '<tr><td colspan="14" style="text-align:center; padding: 20px;">Loading data...</td></tr>';
    try {
      const querySnapshot = await getDocs(collection(db, "students"));
      allStudents = [];
      querySnapshot.forEach((doc) => {
        allStudents.push({ id: doc.id, ...doc.data() });
      });
      renderTable(allStudents);
    } catch (error) {
      console.error("Error fetching documents: ", error);
      tableBody.innerHTML = `<tr><td colspan="14" style="text-align:center; color:red;">Error loading data: ${error.message}</td></tr>`;
    }
  }

  function renderTable(data) {
    if (data.length === 0) {
      tableBody.innerHTML = '<tr><td colspan="14" style="text-align:center; padding: 20px;">No records found.</td></tr>';
      return;
    }

    tableBody.innerHTML = data.map((s, index) => `
      <tr>
        <td>${index + 1}</td>
        <td><strong>${s.fullName || s.name || '-'}</strong></td>
        <td>${s.mobileNumber || s.phone || s.id}</td>
        <td>${s.email || '-'}</td>
        <td>${s.place || '-'}</td>
        <td>${s.address || '-'}</td>
        <td>${s.dateOfBirth || '-'}</td>
        <td>${s.religiousDegree || '-'}</td>
        <td>${s.religiousInstitution || '-'}</td>
        <td>${s.secularEducation || '-'}</td>
        <td>${s.currentProfession || '-'}</td>
        <td>${s.paymentDetails || '-'}</td>
        <td>${s.registeredAt ? s.registeredAt.split('T')[0] : (s.admissionDate || '-')}</td>
        <td><span class="badge">${s.status || 'Active'}</span></td>
      </tr>
    `).join('');
  }

  // Search filter
  searchInput.addEventListener("input", (e) => {
    const term = e.target.value.toLowerCase();
    const filtered = allStudents.filter(s => 
      (s.fullName && s.fullName.toLowerCase().includes(term)) ||
      (s.name && s.name.toLowerCase().includes(term)) ||
      (s.mobileNumber && s.mobileNumber.includes(term)) ||
      (s.place && s.place.toLowerCase().includes(term))
    );
    renderTable(filtered);
  });

  // Export to CSV (Excel format)
  document.getElementById("exportBtn").addEventListener("click", () => {
    if (allStudents.length === 0) return alert("No data to export!");
    let csv = "Sl No,Full Name,Mobile,Email,Place,Address,DOB,Religious Degree,Institution,Secular Edu,Profession,Payment Details,Date,Status\n";
    allStudents.forEach((s, i) => {
      csv += `"${i+1}","${s.fullName || s.name || ''}","${s.mobileNumber || s.phone || s.id}","${s.email || ''}","${s.place || ''}","${s.address || ''}","${s.dateOfBirth || ''}","${s.religiousDegree || ''}","${s.religiousInstitution || ''}","${s.secularEducation || ''}","${s.currentProfession || ''}","${s.paymentDetails || ''}","${s.registeredAt || s.admissionDate || ''}","${s.status || ''}"\n`;
    });
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = `Students_List_${new Date().toISOString().split('T')[0]}.csv`;
    link.click();
  });

  document.getElementById("refreshBtn").addEventListener("click", fetchStudents);

  // Load on start
  fetchStudents();
</script>

</body>
</html>
