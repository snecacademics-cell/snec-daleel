<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SNEC Daleel - Course Admission Form</title>
  <!-- Google Fonts for Modern Styling -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }
    body {
      background: #f0f4f8;
      margin: 0;
      padding: 30px 15px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .form-card {
      background: #ffffff;
      padding: 35px 30px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.06);
      width: 100%;
      max-width: 550px;
    }
    h2 {
      margin-top: 0;
      margin-bottom: 5px;
      color: #1e293b;
      text-align: center;
      font-weight: 700;
    }
    p.subtitle {
      text-align: center;
      color: #64748b;
      margin-bottom: 25px;
      font-size: 14px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 500;
      color: #334155;
      font-size: 14px;
    }
    input, select, textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
      color: #1e293b;
      background-color: #f8fafc;
      transition: all 0.3s ease;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #2563eb;
      background-color: #ffffff;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }
    textarea {
      resize: vertical;
      min-height: 70px;
    }
    button {
      width: 100%;
      padding: 14px;
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      transition: background-color 0.2s ease;
    }
    button:hover {
      background-color: #1d4ed8;
    }
    .status-msg {
      margin-top: 18px;
      text-align: center;
      font-weight: 500;
      font-size: 15px;
    }
  </style>
</head>
<body>

<div class="form-card">
  <h2>Course Admission</h2>
  <p class="subtitle">Please fill out the registration form below</p>

  <form id="admissionForm">
    <!-- 1. Full Name -->
    <div class="form-group">
      <label for="fullName">1. Full Name</label>
      <input type="text" id="fullName" required placeholder="Enter full name">
    </div>

    <!-- 2. E-Mail -->
    <div class="form-group">
      <label for="email">2. E-Mail Address</label>
      <input type="email" id="email" required placeholder="name@example.com">
    </div>

    <!-- 3. Mobile Number -->
    <div class="form-group">
      <label for="mobile">3. Mobile Number (WhatsApp)</label>
      <input type="tel" id="mobile" required placeholder="10-digit mobile number">
    </div>

    <!-- 4. Place -->
    <div class="form-group">
      <label for="place">4. Place / City</label>
      <input type="text" id="place" required placeholder="Your town or city">
    </div>

    <!-- 5. Address -->
    <div class="form-group">
      <label for="address">5. Address</label>
      <textarea id="address" rows="2" required placeholder="Full postal address"></textarea>
    </div>

    <!-- 6. Date of Birth -->
    <div class="form-group">
      <label for="dob">6. Date of Birth</label>
      <input type="date" id="dob" required>
    </div>

    <!-- 7. Religious Degree -->
    <div class="form-group">
      <label for="religiousDegree">7. Religious Degree / Qualification (മത ബിരുദം)</label>
      <input type="text" id="religiousDegree" required placeholder="e.g. Moulavi Fazil, Wafy, etc.">
    </div>

    <!-- 8. Religious Institution -->
    <div class="form-group">
      <label for="religiousInstitution">8. Institution of Religious Degree (ബിരുദം നേടിയ സ്ഥാപനം)</label>
      <input type="text" id="religiousInstitution" required placeholder="Name of institution / university">
    </div>

    <!-- 9. Secular Education -->
    <div class="form-group">
      <label for="secularEducation">9. Secular Education (ഭൗതിക വിദ്യാഭ്യാസം)</label>
      <input type="text" id="secularEducation" required placeholder="e.g. Plus Two, BA, B.Com, etc.">
    </div>

    <!-- 10. Current Job/Profession -->
    <div class="form-group">
      <label for="currentJob">10. Current Profession / Job (നിലവിലെ ജോലി)</label>
      <input type="text" id="currentJob" required placeholder="e.g. Teacher, Imam, Student, Business">
    </div>

    <!-- 11. Payment Details -->
    <div class="form-group">
      <label for="paymentDetails">11. Payment Details (പേയ്‌മെന്റ് വിവരങ്ങൾ)</label>
      <input type="text" id="paymentDetails" required placeholder="Transaction ID / UPI Reference / Amount Paid">
    </div>

    <button type="submit" id="submitBtn">Submit Registration</button>
  </form>

  <div id="statusMessage" class="status-msg"></div>
</div>

<!-- Firebase SDKs -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  // SNEC Daleel Firebase Config
  const firebaseConfig = {
    apiKey: "AIzaSyAfaDp6H7eSToA5f4_TFhNGBU9OLoq4E7U",
    authDomain: "snec-daleel.firebaseapp.com",
    projectId: "snec-daleel",
    storageBucket: "snec-daleel.firebasestorage.app",
    messagingSenderId: "201962463257",
    appId: "1:201962463257:web:f56ceb2157984e1de28a88",
    measurementId: "G-NOWFFPDXJP"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const form = document.getElementById("admissionForm");
  const statusMsg = document.getElementById("statusMessage");
  const submitBtn = document.getElementById("submitBtn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    submitBtn.disabled = true;
    submitBtn.innerText = "Submitting...";
    statusMsg.innerText = "";

    const mobile = document.getElementById("mobile").value.trim();
    const submissionDate = new Date().toISOString();

    // Data payload matching the 11 fields
    const studentData = {
      fullName: document.getElementById("fullName").value.trim(),
      email: document.getElementById("email").value.trim(),
      mobileNumber: mobile,
      place: document.getElementById("place").value.trim(),
      address: document.getElementById("address").value.trim(),
      dateOfBirth: document.getElementById("dob").value,
      religiousDegree: document.getElementById("religiousDegree").value.trim(),
      religiousInstitution: document.getElementById("religiousInstitution").value.trim(),
      secularEducation: document.getElementById("secularEducation").value.trim(),
      currentProfession: document.getElementById("currentJob").value.trim(),
      paymentDetails: document.getElementById("paymentDetails").value.trim(),
      registeredAt: submissionDate,
      status: "Active"
    };

    try {
      // സേവ് ചെയ്യുമ്പോൾ മൊബൈൽ നമ്പർ ഡോക്യുമെന്റ് ഐഡിയായി നൽകുന്നു
      await setDoc(doc(db, "students", mobile), studentData);

      statusMsg.style.color = "#16a34a";
      statusMsg.innerText = "Registration submitted successfully!";
      form.reset();
    } catch (error) {
      console.error("Submission Error: ", error);
      statusMsg.style.color = "#dc2626";
      statusMsg.innerText = "Error submitting form: " + error.message;
    } finally {
      submitBtn.disabled = false;
      submitBtn.innerText = "Submit Registration";
    }
  });
</script>

</body>
</html>
